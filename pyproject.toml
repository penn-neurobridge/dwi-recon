[project]
name = "dwi-minimum-preprocessing"
version = "0.2.0"
description = "DWI preprocessing and structural connectivity pipeline"
requires-python = ">=3.13"
dependencies = [
    "h5py>=3.0.0",
    "joblib>=1.2.0",
    "matplotlib>=3.5.0",
    "nibabel>=3.2.0",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "trimesh>=3.0.0",
]

[project.scripts]
dwi-preprocess = "run_dwi_preprocessing:main"
dwi-ieeg-connectivity = "run_ieeg_connectivity:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dwi_preprocessing"]
